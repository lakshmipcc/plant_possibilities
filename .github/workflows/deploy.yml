name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Necessary permissions for GitHub Pages deployment
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          # 1. Get the full secret from your GitHub Settings
          STR="${{ secrets.GEMINI_API_KEY }}"
          
          # 2. Split the secret into two pieces as we planned
          K1_VAL=${STR:0:20}
          K2_VAL=${STR:20}
          
          # 3. Build the app with the base-href and the keys
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=K1=$K1_VAL \
            --dart-define=K2=$K2_VAL

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web